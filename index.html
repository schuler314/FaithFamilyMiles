    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdfa; /* Light teal background */
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
            -webkit-tap-highlight-color: transparent;
        }
        
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 400px;
            height: 55vh;
            min-height: 320px;
            max-height: 450px;
        }

        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-out, opacity 0.3s ease-out;
            transform-style: preserve-3d;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .card.slide-out {
            transform: translateX(-120%) rotate(-10deg);
            opacity: 0;
        }

        .card.slide-in {
            animation: slideIn 0.4s forwards;
        }

        @keyframes slideIn {
            0% { transform: translateX(120%) rotate(10deg); opacity: 0; }
            100% { transform: translateX(0) rotate(0); opacity: 1; }
        }

        /* Category Themes */
        .theme-silly { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #4a044e; }
        .theme-imagination { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); color: #082f49; }
        .theme-family { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); color: #14532d; }
        .theme-faith { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); color: #312e81; }

        .btn-press:active { transform: scale(0.95); }
    </style>

        let activeDeck = [];
        let currentIndex = 0;
        let isAnimating = false;

        function showQRCode() {
            const modal = document.getElementById('qr-modal');
            const content = document.getElementById('qr-modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function hideQRCode() {
            const modal = document.getElementById('qr-modal');
            const content = document.getElementById('qr-modal-content');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }, 300); // Matches the CSS transition duration
        }

        function startGame() {
            const useSilly = document.getElementById('cat-silly').checked;
            const useImagination = document.getElementById('cat-imagination').checked;
            const useFamily = document.getElementById('cat-family').checked;
            const useFaith = document.getElementById('cat-faith').checked;

            activeDeck = allCards.filter(card => {
                if (card.cat === 'silly' && useSilly) return true;
                if (card.cat === 'imagination' && useImagination) return true;
                if (card.cat === 'family' && useFamily) return true;
                if (card.cat === 'faith' && useFaith) return true;
                return false;
            });

            if (activeDeck.length === 0) {
                alert("Please select at least one category!");
                return;
            }

            // Shuffle deck
            for (let i = activeDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activeDeck[i], activeDeck[j]] = [activeDeck[j], activeDeck[i]];
            }

            currentIndex = 0;
            
            // Transition UI
            document.getElementById('home-screen').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('game-screen').classList.remove('opacity-0', 'pointer-events-none');
            
            renderCard(activeDeck[currentIndex]);
            updateCounter();
        }

        function updateCounter() {
            document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${activeDeck.length}`;
        }

        function nextCard() {
            if (isAnimating) return;
            if (currentIndex >= activeDeck.length - 1) {
                // Game over, reshuffle or back to menu
                if(confirm("You've reached the end of the deck! Reshuffle and keep playing?")) {
                    startGame();
                } else {
                    returnToMenu();
                }
                return;
            }

            isAnimating = true;
            const cardEl = document.getElementById('active-card');
            
            // Slide out
            cardEl.classList.add('slide-out');
            
            setTimeout(() => {
                currentIndex++;
                renderCard(activeDeck[currentIndex]);
                updateCounter();
                
                // Reset and slide in
                cardEl.classList.remove('slide-out');
                cardEl.classList.add('slide-in');
                
                setTimeout(() => {
                    cardEl.classList.remove('slide-in');
                    isAnimating = false;
                }, 400); // Wait for slide in animation to finish
            }, 400); // Wait for slide out animation to finish
        }

        function renderCard(card) {
            const cardEl = document.getElementById('active-card');
            const iconEl = document.getElementById('card-icon');
            const catEl = document.getElementById('card-category');
            const textEl = document.getElementById('card-text');

            // Reset themes
            cardEl.className = 'card'; 
            cardEl.classList.add(`theme-${card.cat}`);

            iconEl.innerText = card.icon;
            catEl.innerText = card.label;
            textEl.innerText = card.text;
        }

        function returnToMenu() {
            document.getElementById('game-screen').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('home-screen').classList.remove('opacity-0', 'pointer-events-none');
        }
    </script>
